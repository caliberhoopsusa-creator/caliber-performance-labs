<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CALIBER Direction A, final</title>
<style>
/* Self hosted only. Same three OFL faces the app ships, loaded from the same
   origin. No external font host, ever. */
@font-face {
  font-family: "Archivo Variable";
  src: url("/fonts/archivo-latin-wdth-normal.woff2") format("woff2-variations");
  font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
}
@font-face {
  font-family: "Geist Variable";
  src: url("/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
  font-weight: 100 900; font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
  font-weight: 700; font-display: swap;
}

:root {
  --court: #0B0B0D;
  --bone: #F5F1E8;
  --red: #FF2D2D;
  --gold: #E8B84A;
  --violet: #7C4DFF;
  --chalk-strong: rgba(245,241,232,0.28);
  --ink: #0B0B0D;
  --fog: rgba(245,241,232,0.62);

  --f-display: "Neue Machina", "Archivo Variable", "Archivo Black", system-ui, sans-serif;
  --f-body: "Inter", "Geist Variable", system-ui, -apple-system, sans-serif;
  --f-num: "Space Grotesk", "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #17171a; font-family: var(--f-body); padding: 40px; }
.rig { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }

/* Display is expanded and heavy. Setting both axes is what separates the
   CALIBER register from plain bold Archivo. */
.display { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; letter-spacing: -0.02em; }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

.card {
  position: relative; overflow: hidden; border-radius: 14px;
  display: flex; flex-direction: column;
  padding: var(--pad); gap: var(--g);
  color: var(--ink);
}

/* Rarity frames. The stock travels as a variable so no later rule can replace
   the gradient by setting `background` directly. */
.t-chrome { --stock: var(--bone); background: var(--stock); border: var(--border3) solid var(--gold); }
.t-hot    { --stock: var(--bone); background: var(--stock); border: var(--border2) solid var(--red); }
.t-base   { --stock: var(--bone); background: var(--stock); border: var(--border1) solid rgba(11,11,13,0.28); }
.t-rookie { --stock: var(--court); background: var(--stock); border: var(--border1) dashed var(--chalk-strong); color: var(--bone); }
.t-prism {
  --stock: var(--bone);
  border: var(--border2) solid transparent;
  background:
    linear-gradient(var(--stock), var(--stock)) padding-box,
    linear-gradient(135deg, var(--violet), var(--red)) border-box;
}

/* Chrome carries the one animated treatment: a shimmer sweep, 2s loop. */
.t-chrome::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(232,184,74,0.32) 50%, transparent 62%);
  background-size: 250% 100%;
  animation: chrome-sweep 2s linear infinite;
}
@keyframes chrome-sweep { from { background-position: 200% 0; } to { background-position: -60% 0; } }
@media (prefers-reduced-motion: reduce) {
  .t-chrome::after { animation: none; }
}

.window { border: 1px solid var(--rule); padding: var(--hair); flex: 1; min-height: 0; display: flex; }
.photo {
  height: 100%; width: 100%; margin: auto;
  background:
    repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 10px),
    var(--hatchBg);
  display: grid; place-items: end start; padding: 12px;
}
.photo span { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hatchText); }

.meta { letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.plate {
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: var(--platePad) 0; display: flex; align-items: center; justify-content: center;
}
.grade { font-family: var(--f-num); font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.stats { display: flex; gap: var(--g); }
.stat-l { display: block; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat-v { font-family: var(--f-num); font-weight: 700; letter-spacing: -0.01em; }
.mark {
  display: flex; justify-content: flex-end; align-items: baseline; gap: 8px;
  opacity: 0.62; letter-spacing: 0.08em; text-transform: uppercase;
}
.mark i { font-style: normal; text-transform: none; letter-spacing: 0.02em; }
.rookie-tag {
  position: absolute; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fog); border: 1px solid var(--chalk-strong); border-radius: 4px;
}
.spacer { flex: 1; }
</style>
</head>
<body>
<div class="rig" id="rig"></div>

<script>
/* Placeholder athlete, fixed by the brief. The photo slot is hatched and
   labelled so nothing here reads as a real player or a real stat line. */
const P = {
  name: "Jordan Reyes", position: "SG", classYear: "'27",
  school: "Missoula Sentinel", grade: "A-",
  stats: [ { l: "PPG", v: "22.4" }, { l: "FG%", v: "48%" } ],
  url: "caliber.app/jordanreyes",
};

const SIZES = { story: { w: 1080, h: 1920 }, feed: { w: 1080, h: 1080 } };
const TIERS = ["chrome", "prism", "hot", "base", "rookie"];

function card(tier, w, h) {
  const u = w / 390;
  const tall = h / w > 1.2;
  const dark = tier === "rookie";
  const s = (n) => Math.round(n * u) + "px";
  /* display-l is a ceiling, not a promise. Shrink to fit rather than truncate:
     "Jordan Reyes" in expanded black at the full 48 token overruns 1080. */
  const inner = w - 2 * 24 * u;
  const nameSize = Math.max(
    Math.min(Math.round(48 * u), Math.floor(inner / (0.78 * P.name.length))),
    Math.round(24 * u),
  );

  const el = document.createElement("div");
  el.className = `card t-${tier}`;
  el.style.cssText = `
    width:${w}px; height:${h}px;
    --pad:${s(24)}; --g:${s(16)}; --hair:${s(4)};
    --platePad:${s(tall ? 20 : 12)}; --photoMin:${Math.round(h * 0.30)}px;
    --border1:${Math.max(1, Math.round(u))}px;
    --border2:${Math.max(2, Math.round(2*u))}px;
    --border3:${Math.max(3, Math.round(3*u))}px;
    --rule:${dark ? "rgba(245,241,232,0.28)" : "rgba(11,11,13,0.18)"};
    --muted:${dark ? "rgba(245,241,232,0.62)" : "rgba(11,11,13,0.62)"};
    --hatch:${dark ? "rgba(245,241,232,0.05)" : "rgba(11,11,13,0.05)"};
    --hatchBg:${dark ? "rgba(245,241,232,0.06)" : "rgba(11,11,13,0.07)"};
    --hatchText:${dark ? "rgba(245,241,232,0.38)" : "rgba(11,11,13,0.38)"};
  `;

  el.innerHTML = `
    ${tier === "rookie" ? `<span class="rookie-tag display" style="top:${s(16)};left:${s(16)};font-size:${s(11)};padding:${s(3)} ${s(8)}">Rookie</span>` : ""}
    <div class="window"><div class="photo"><span>Photo 4:5</span></div></div>
    <div>
      <div class="display" style="font-size:${nameSize}px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${P.name}</div>
      <div class="meta" style="font-size:${s(11)};margin-top:${s(6)}">${P.position}, ${P.classYear}, ${P.school}</div>
    </div>
    <div class="plate"><span class="grade tnum" style="font-size:${s(72)}">${P.grade}</span></div>
    <div class="stats">
      ${P.stats.map(st => `
        <div>
          <span class="stat-l" style="font-size:${s(11)}">${st.l}</span>
          <span class="stat-v tnum" style="font-size:${s(22)}">${st.v}</span>
        </div>`).join("")}
    </div>
    <div class="mark" style="font-size:${s(11)}"><span class="display">Caliber</span><i>${P.url}</i></div>
  `;
  return el;
}

const rig = document.getElementById("rig");

/* Prism at story size is the hero. Every tier at feed size shows the ladder. */
const hero = document.createElement("div");
hero.id = "hero";
hero.appendChild(card("prism", SIZES.story.w, SIZES.story.h));
rig.appendChild(hero);

for (const tier of TIERS) {
  const holder = document.createElement("div");
  holder.id = `tier-${tier}`;
  holder.appendChild(card(tier, SIZES.feed.w, SIZES.feed.h));
  rig.appendChild(holder);
}
</script>
</body>
</html>
